name: Set up R
description: >-
  Installs the version of R recorded in renv.lock and restores the project
  library from the lockfile, with binary packages from Posit Package Manager.

runs:
  using: composite
  steps:
    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: renv
        use-public-rspm: true

    - name: Restore the renv library
      uses: r-lib/actions/setup-renv@v2
